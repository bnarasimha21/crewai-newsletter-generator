# Serverless inference pricing (USD per 1,000,000 tokens), used by
# newsletter/history.py to estimate a run's cost from its recorded
# prompt_tokens/completion_tokens.
#
# Source: https://docs.digitalocean.com/products/gradient-ai-platform/details/pricing/
# As of: 2026-11-12. Cross-checked against the same figures published at
# https://docs.digitalocean.com/products/inference-hub/details/pricing/
# Re-verify against the live page before trusting these for a real invoice;
# DigitalOcean updates per-model rates as providers change theirs. No Llama
# model is currently listed on either page, so none is included here.
#
# cache_read_input is the discounted rate for cached input tokens, listed
# separately from the standard input rate; this project does not use prompt
# caching, so it is recorded for completeness but unused by history.py.

models:
  gpt-4o-mini:
    provider: openai
    input: 0.15
    output: 0.60
    cache_read_input: 0.075
  deepseek-v3.2:
    provider: deepseek
    input: 0.50
    output: 1.60
    cache_read_input: 0.15
  deepseek-v4-flash-0731:
    provider: deepseek
    input: 0.14
    output: 0.28
    cache_read_input: 0.028
  deepseek-v4.1-flash:
    provider: deepseek
    input: 0.30
    output: 1.20
    cache_read_input: 0.006
  ministral-3-14b-instruct:
    provider: mistral
    input: 0.20
    output: 0.20
    cache_read_input: 0.04

default_model: gpt-4o-mini
