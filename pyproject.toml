[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-newsletter-generator"
version = "0.2.0"
description = "Generate topic newsletters as PDFs with a two-agent CrewAI pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
newsletter = "newsletter.__main__:main"

[tool.setuptools.packages.find]
include = ["newsletter*", "evals*"]

[tool.setuptools.package-data]
newsletter = ["templates/*.j2", "templates/*.css", "config/*.yaml", "pricing.yaml"]

[tool.pytest.ini_options]
markers = [
    "integration: exercises the real crew / CLI / render pipeline end to end (still offline, uses FakeLLM)",
]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
